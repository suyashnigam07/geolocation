name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show latest Firebase / Google Sign-In library versions
        run: |
          for a in com/google/gms/google-services com/google/firebase/firebase-bom \
                   androidx/credentials/credentials androidx/credentials/credentials-play-services-auth \
                   com/google/android/libraries/identity/googleid/googleid com/android/tools/build/gradle; do
            v=$(curl -s https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml | grep -oE '<version>[^<]+' | cut -d'>' -f2 | grep -vE 'alpha|beta|rc' | tail -3 | tr '\n' ' ')
            echo "STABLE $a $v"
          done
          curl -s https://dl.google.com/dl/android/maven2/com/google/firebase/firebase-bom/35.1.0/firebase-bom-35.1.0.pom | grep -A1 -E 'firebase-(auth|firestore)</artifactId>' | grep -oE '<version>[^<]+'
          curl -s https://dl.google.com/dl/android/maven2/com/google/firebase/firebase-auth/maven-metadata.xml | grep -oE '<latest>[^<]+'

      - name: Build APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Optional: Firebase config for friends, from a repository secret.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Pedometer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pedometer-apk
          path: Pedometer.apk

      - name: Publish to "latest" release (easy download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Pedometer.apk \
            --target "$GITHUB_SHA" \
            --title "Pedometer (latest build)" \
            --notes "Download Pedometer.apk on your Android phone and open it to install."
