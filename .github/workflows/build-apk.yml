name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Optional: Firebase config for friends, from a repository secret.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Pedometer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pedometer-apk
          path: Pedometer.apk

      - name: Publish to "latest" release (easy download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Pedometer.apk \
            --target "$GITHUB_SHA" \
            --title "Pedometer (latest build)" \
            --notes "Download Pedometer.apk on your Android phone and open it to install."
