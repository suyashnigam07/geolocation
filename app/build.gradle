plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simple.pedometer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.simple.pedometer'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.7'

        // Google Maps key: from the MAPS_API_KEY environment variable (a GitHub
        // secret on CI) or gradle property. Without it the app draws walks
        // without a street map.
        def mapsKey = System.getenv('MAPS_API_KEY') ?: (project.findProperty('MAPS_API_KEY') ?: '')
        manifestPlaceholders = [MAPS_API_KEY: mapsKey]
        buildConfigField 'String', 'MAPS_API_KEY', "\"${mapsKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can be installed
        // over the previous one without losing your step history.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
}
