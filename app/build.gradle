plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simple.pedometer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.simple.pedometer'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can be installed
        // over the previous one without losing your step history.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
