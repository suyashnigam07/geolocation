plugins {
    id 'com.android.application'
    // Reads app/google-services.json (Firebase project freindspedometer).
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.simple.pedometer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.simple.pedometer'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '2.1.1'
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can be installed
        // over the previous one without losing your step history.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    // "Sign in with Google" through Android's Credential Manager.
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
}
